<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Memoriam Papae Francisci</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            background: linear-gradient(180deg, #050508 0%, #0a0a12 50%, #050508 100%);
            color: #e8d5b7;
            text-align: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(100, 80, 50, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 40px;
            padding: 30px 20px;
            position: relative;
            animation: fadeInDown 1.5s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }

        .spiritual-symbol {
            margin: 15px 0 30px;
            position: relative;
            display: inline-block;
            width: 120px;
            height: 120px;
        }

        .spiritual-symbol svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
            animation: symbolGlow 4s ease-in-out infinite;
        }

        @keyframes symbolGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 40px rgba(212, 175, 55, 0.3));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.9)) drop-shadow(0 0 60px rgba(212, 175, 55, 0.5));
                transform: scale(1.03);
            }
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 3.2em;
            margin-bottom: 10px;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(212, 175, 55, 0.4);
            letter-spacing: 6px;
            font-weight: 700;
            line-height: 1.2;
        }

        h2 {
            color: #c9a961;
            font-style: italic;
            font-weight: 400;
            font-size: 1.8em;
            margin-bottom: 20px;
            text-shadow: 
                1px 1px 3px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(201, 169, 97, 0.3);
            letter-spacing: 3px;
        }

        .dates {
            font-size: 1.3em;
            color: #b8966b;
            letter-spacing: 5px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(184, 150, 107, 0.4);
        }

        .world-section {
            margin: 40px 0;
            padding: 30px;
            background: 
                linear-gradient(135deg, rgba(5, 5, 15, 0.8) 0%, rgba(10, 10, 20, 0.9) 100%);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 60px rgba(212, 175, 55, 0.05);
        }

        .map-title {
            font-size: 1.6em;
            color: #d4af37;
            margin-bottom: 15px;
            font-style: italic;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        .map-subtitle {
            font-size: 1.1em;
            color: #8b7355;
            margin-bottom: 25px;
            font-style: italic;
        }

        .globe-container {
            width: 100%;
            height: 550px;
            position: relative;
            margin: 20px 0;
            cursor: grab;
            border-radius: 15px;
            overflow: hidden;
        }

        .globe-container:active {
            cursor: grabbing;
        }

        .globe-container canvas {
            border-radius: 15px;
        }

        .selected-language-info {
            margin-top: 20px;
            padding: 15px 25px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            min-width: 200px;
        }

        .selected-language-info .label {
            font-size: 0.9em;
            color: #8b7355;
            margin-bottom: 5px;
        }

        .selected-language-info .language-name {
            font-size: 1.5em;
            color: #d4af37;
            font-weight: 600;
        }

        .audio-controls {
            margin: 40px 0;
            padding: 35px;
            background: 
                linear-gradient(135deg, rgba(5, 5, 15, 0.8) 0%, rgba(10, 10, 20, 0.9) 100%);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 60px rgba(212, 175, 55, 0.05);
        }

        .current-language {
            font-size: 1.6em;
            color: #d4af37;
            margin-bottom: 20px;
            font-style: italic;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        .instructions {
            font-style: italic;
            margin: 15px 0;
            color: #8b7355;
            font-size: 1.1em;
        }

        .play-button {
            display: inline-block;
            background: linear-gradient(135deg, #8b6914 0%, #d4af37 30%, #f4d03f 50%, #d4af37 70%, #8b6914 100%);
            background-size: 200% 200%;
            color: #1a0a0a;
            padding: 18px 40px;
            font-size: 1.3em;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin: 20px 0;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 
                0 6px 20px rgba(212, 175, 55, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 
                0 8px 30px rgba(212, 175, 55, 0.7),
                inset 0 2px 15px rgba(255, 255, 255, 0.3);
            background-position: 100% 0;
        }

        .play-button.playing {
            background: linear-gradient(135deg, #6b4e0f 0%, #b8960b 30%, #d4af37 50%, #b8960b 70%, #6b4e0f 100%);
            animation: buttonPulse 2s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            }
            50% { 
                box-shadow: 0 0 50px rgba(212, 175, 55, 1);
            }
        }

        footer {
            margin-top: 60px;
            color: #6b5a45;
            font-size: 1.2em;
            line-height: 2;
            padding: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
        }

        footer p {
            margin: 10px 0;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            h2 { font-size: 1.4em; }
            .spiritual-symbol { width: 90px; height: 90px; }
            .globe-container { height: 400px; }
            .world-section, .audio-controls { padding: 20px; }
            .play-button { padding: 15px 30px; font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="spiritual-symbol">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="doveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#f4d03f"/>
                            <stop offset="100%" style="stop-color:#b8960b"/>
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <!-- Colomba che ascende -->
                    <ellipse cx="50" cy="55" rx="12" ry="18" fill="url(#doveGrad)" filter="url(#glow)"/>
                    <circle cx="50" cy="40" r="10" fill="url(#doveGrad)" filter="url(#glow)"/>
                    <path d="M 38 50 Q 20 35 15 42 Q 22 50 38 60 Z" fill="url(#doveGrad)" filter="url(#glow)"/>
                    <path d="M 62 50 Q 80 35 85 42 Q 78 50 62 60 Z" fill="url(#doveGrad)" filter="url(#glow)"/>
                    <!-- Raggi di luce -->
                    <line x1="50" y1="25" x2="50" y2="10" stroke="#f4d03f" stroke-width="2" opacity="0.7"/>
                    <line x1="40" y1="28" x2="35" y2="15" stroke="#f4d03f" stroke-width="1.5" opacity="0.5"/>
                    <line x1="60" y1="28" x2="65" y2="15" stroke="#f4d03f" stroke-width="1.5" opacity="0.5"/>
                </svg>
            </div>
            <h1>In Memoriam</h1>
            <h2>Papae Francisci</h2>
            <div class="dates">MCMXXXVI – MMXXV</div>
        </div>

        <div class="world-section">
            <div class="map-title">Clicca sul mondo per ascoltare il canto</div>
            <div class="map-subtitle">Il globo ruota — trascinalo per esplorare — clicca su una zona illuminata</div>
            <div class="globe-container" id="globeContainer"></div>
            <div class="selected-language-info">
                <div class="label">Lingua selezionata:</div>
                <div class="language-name" id="selectedLanguageName">Latina</div>
            </div>
        </div>

        <div class="audio-controls">
            <div class="current-language" id="currentLanguage">Latina</div>
            <div class="instructions">Premi per ascoltare:</div>
            <button id="playButton" class="play-button">▶ Audi Canticum</button>
            <audio id="audioPlayer" loop>
                <source id="audioSource" src="Franciscus-de-Caelo-LT.mp3" type="audio/mpeg">
            </audio>
        </div>

        <footer>
            <p>Requiescat in Pace</p>
            <p>Lux perpetua luceat ei</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playButton = document.getElementById('playButton');
            const audioPlayer = document.getElementById('audioPlayer');
            const audioSource = document.getElementById('audioSource');
            const currentLanguageEl = document.getElementById('currentLanguage');
            const selectedLanguageName = document.getElementById('selectedLanguageName');
            const globeContainer = document.getElementById('globeContainer');
            
            // Lingue con coordinate geografiche
            const languages = {
                latin: { file: "Franciscus-de-Caelo-LT.mp3", name: "Latina", native: "Latina", lat: 41.9, lon: 12.5 },
                italian: { file: "Franciscus-de-Caelo-IT.mp3", name: "Italica", native: "Italiano", lat: 42.5, lon: 12.5 },
                spanish: { file: "Franciscus-de-Caelo-SP.mp3", name: "Hispanica", native: "Español", lat: 40.4, lon: -3.7 },
                portuguese: { file: "Franciscus-de-Caelo-POR.mp3", name: "Lusitana", native: "Português", lat: -15.8, lon: -47.9 },
                french: { file: "Franciscus-de-Caelo-FR.mp3", name: "Gallica", native: "Français", lat: 48.9, lon: 2.3 },
                english: { file: "Franciscus-de-Caelo-UK.mp3", name: "Anglica", native: "English", lat: 51.5, lon: -0.1 },
                german: { file: "Franciscus-de-Caelo-TE.mp3", name: "Germanica", native: "Deutsch", lat: 52.5, lon: 13.4 },
                russian: { file: "Franciscus-de-Caelo-RU.mp3", name: "Russica", native: "Русский", lat: 55.8, lon: 37.6 },
                arabic: { file: "Franciscus-de-Caelo-ARA.mp3", name: "Arabica", native: "العربية", lat: 24.7, lon: 46.7 },
                hebrew: { file: "Franciscus-de-Caelo-SR.mp3", name: "Hebraica", native: "עברית", lat: 31.8, lon: 35.2 },
                chinese: { file: "Franciscus-de-Caelo-CIN.mp3", name: "Sinica", native: "中文", lat: 39.9, lon: 116.4 },
                korean: { file: "Franciscus-de-Caelo-KR.mp3", name: "Coreana", native: "한국어", lat: 37.6, lon: 127.0 },
                swahili: { file: "Franciscus-de-Caelo-SWAHILI.mp3", name: "Swahili", native: "Kiswahili", lat: -1.3, lon: 36.8 },
                hausa: { file: "Franciscus-de-Caelo-HAUSA.mp3", name: "Hausa", native: "Hausa", lat: 12.0, lon: 8.5 },
                lingala: { file: "Franciscus-de-Caelo-LINGALA.mp3", name: "Lingala", native: "Lingála", lat: -4.3, lon: 15.3 }
            };

            let currentLang = 'latin';
            let scene, camera, renderer, globe, markers = [], markerGroup;
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let autoRotate = true;

            function initGlobe() {
                const width = globeContainer.offsetWidth;
                const height = globeContainer.offsetHeight;

                // Scene
                scene = new THREE.Scene();
                
                // Camera
                camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
                camera.position.z = 4;

                // Renderer
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                globeContainer.appendChild(renderer.domElement);

                // Luci
                const ambientLight = new THREE.AmbientLight(0x333333, 1);
                scene.add(ambientLight);
                
                const pointLight = new THREE.PointLight(0xffffff, 1.5);
                pointLight.position.set(5, 3, 5);
                scene.add(pointLight);

                // Gruppo per il globo e i marker (così ruotano insieme)
                markerGroup = new THREE.Group();
                scene.add(markerGroup);

                // Globo con texture della Terra di notte
                const globeGeometry = new THREE.SphereGeometry(1.5, 64, 64);
                
                // Texture loader
                const textureLoader = new THREE.TextureLoader();
                
                // Usa una texture della Terra di notte
                const earthTexture = textureLoader.load(
                    'https://raw.githubusercontent.com/turban/webgl-earth/master/images/2_no_clouds_8k.jpg',
                    function(texture) {
                        globeMaterial.map = texture;
                        globeMaterial.needsUpdate = true;
                    }
                );
                
                const nightTexture = textureLoader.load(
                    'https://raw.githubusercontent.com/turban/webgl-earth/master/images/earth_lights_lrg.jpg',
                    function(texture) {
                        globeMaterial.emissiveMap = texture;
                        globeMaterial.emissive = new THREE.Color(0xffaa44);
                        globeMaterial.emissiveIntensity = 0.8;
                        globeMaterial.needsUpdate = true;
                    }
                );

                const globeMaterial = new THREE.MeshPhongMaterial({
                    color: 0x1a2a3a,
                    shininess: 25
                });

                globe = new THREE.Mesh(globeGeometry, globeMaterial);
                markerGroup.add(globe);

                // Atmosfera (glow esterno)
                const atmosphereGeometry = new THREE.SphereGeometry(1.55, 64, 64);
                const atmosphereMaterial = new THREE.MeshBasicMaterial({
                    color: 0x4488ff,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.BackSide
                });
                const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
                markerGroup.add(atmosphere);

                // Aggiungi marker per ogni lingua
                Object.keys(languages).forEach(langKey => {
                    const lang = languages[langKey];
                    const position = latLonToVector3(lang.lat, lang.lon, 1.52);
                    
                    // Marker principale
                    const markerGeometry = new THREE.SphereGeometry(0.04, 16, 16);
                    const markerMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xd4af37
                    });
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.position.copy(position);
                    marker.userData = { lang: langKey, data: lang };
                    markerGroup.add(marker);
                    markers.push(marker);

                    // Glow del marker
                    const glowGeometry = new THREE.SphereGeometry(0.07, 16, 16);
                    const glowMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xd4af37,
                        transparent: true,
                        opacity: 0.4
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    glow.position.copy(position);
                    markerGroup.add(glow);
                    marker.userData.glow = glow;

                    // Anello pulsante
                    const ringGeometry = new THREE.RingGeometry(0.06, 0.08, 32);
                    const ringMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xf4d03f,
                        transparent: true,
                        opacity: 0.6,
                        side: THREE.DoubleSide
                    });
                    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                    ring.position.copy(position);
                    ring.lookAt(new THREE.Vector3(0, 0, 0));
                    markerGroup.add(ring);
                    marker.userData.ring = ring;
                });

                // Evidenzia il marker iniziale
                highlightMarker('latin');

                // Animazione
                let time = 0;
                function animate() {
                    requestAnimationFrame(animate);
                    time += 0.02;
                    
                    // Rotazione automatica
                    if (autoRotate && !isDragging) {
                        markerGroup.rotation.y += 0.003;
                    }

                    // Animazione dei marker
                    markers.forEach(marker => {
                        if (marker.userData.ring) {
                            marker.userData.ring.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
                            marker.userData.ring.material.opacity = 0.4 + Math.sin(time * 2) * 0.2;
                        }
                    });
                    
                    renderer.render(scene, camera);
                }
                animate();

                // Interazione
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();

                function onMouseMove(event) {
                    if (isDragging) {
                        const deltaX = event.clientX - previousMousePosition.x;
                        const deltaY = event.clientY - previousMousePosition.y;

                        markerGroup.rotation.y += deltaX * 0.005;
                        markerGroup.rotation.x += deltaY * 0.005;
                        markerGroup.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, markerGroup.rotation.x));

                        previousMousePosition = { x: event.clientX, y: event.clientY };
                    } else {
                        const rect = globeContainer.getBoundingClientRect();
                        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(markers);

                        if (intersects.length > 0) {
                            globeContainer.style.cursor = 'pointer';
                            const hoveredMarker = intersects[0].object;
                            hoveredMarker.scale.setScalar(1.5);
                        } else {
                            globeContainer.style.cursor = 'grab';
                            markers.forEach(m => {
                                if (m.userData.lang !== currentLang) {
                                    m.scale.setScalar(1);
                                }
                            });
                        }
                    }
                }

                function onMouseDown(event) {
                    isDragging = true;
                    autoRotate = false;
                    previousMousePosition = { x: event.clientX, y: event.clientY };
                    globeContainer.style.cursor = 'grabbing';
                }

                function onMouseUp(event) {
                    if (!isDragging) return;
                    isDragging = false;
                    globeContainer.style.cursor = 'grab';
                    
                    // Riattiva rotazione dopo 3 secondi
                    setTimeout(() => { autoRotate = true; }, 3000);
                }

                function onClick(event) {
                    const rect = globeContainer.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    
                    // Prima controlla i marker
                    const markerIntersects = raycaster.intersectObjects(markers);
                    if (markerIntersects.length > 0) {
                        const lang = markerIntersects[0].object.userData.lang;
                        selectLanguage(lang);
                        return;
                    }

                    // Se clicca sul globo, trova la lingua più vicina
                    const globeIntersects = raycaster.intersectObject(globe);
                    if (globeIntersects.length > 0) {
                        const point = globeIntersects[0].point;
                        // Converti in coordinate sferiche
                        const spherical = new THREE.Spherical();
                        spherical.setFromVector3(point.clone().applyMatrix4(markerGroup.matrixWorld.clone().invert()));
                        
                        const lat = 90 - THREE.MathUtils.radToDeg(spherical.phi);
                        const lon = THREE.MathUtils.radToDeg(spherical.theta) - 90;
                        
                        // Trova la lingua più vicina
                        let nearestLang = 'latin';
                        let nearestDist = Infinity;
                        
                        Object.keys(languages).forEach(langKey => {
                            const lang = languages[langKey];
                            const dist = Math.sqrt(
                                Math.pow(lat - lang.lat, 2) + 
                                Math.pow(lon - lang.lon, 2)
                            );
                            if (dist < nearestDist) {
                                nearestDist = dist;
                                nearestLang = langKey;
                            }
                        });
                        
                        selectLanguage(nearestLang);
                    }
                }

                globeContainer.addEventListener('mousemove', onMouseMove);
                globeContainer.addEventListener('mousedown', onMouseDown);
                globeContainer.addEventListener('mouseup', onMouseUp);
                globeContainer.addEventListener('mouseleave', onMouseUp);
                globeContainer.addEventListener('click', onClick);

                // Touch support
                globeContainer.addEventListener('touchstart', (e) => {
                    isDragging = true;
                    autoRotate = false;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                });
                
                globeContainer.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;
                    markerGroup.rotation.y += deltaX * 0.005;
                    markerGroup.rotation.x += deltaY * 0.005;
                    markerGroup.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, markerGroup.rotation.x));
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                });
                
                globeContainer.addEventListener('touchend', () => {
                    isDragging = false;
                    setTimeout(() => { autoRotate = true; }, 3000);
                });

                // Responsive
                window.addEventListener('resize', () => {
                    const width = globeContainer.offsetWidth;
                    const height = globeContainer.offsetHeight;
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                });
            }

            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                
                const x = -radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);
                
                return new THREE.Vector3(x, y, z);
            }

            function highlightMarker(langKey) {
                markers.forEach(marker => {
                    if (marker.userData.lang === langKey) {
                        marker.scale.setScalar(1.8);
                        marker.material.color.setHex(0xf4d03f);
                        if (marker.userData.glow) {
                            marker.userData.glow.material.opacity = 0.7;
                            marker.userData.glow.scale.setScalar(1.5);
                        }
                    } else {
                        marker.scale.setScalar(1);
                        marker.material.color.setHex(0xd4af37);
                        if (marker.userData.glow) {
                            marker.userData.glow.material.opacity = 0.4;
                            marker.userData.glow.scale.setScalar(1);
                        }
                    }
                });
            }

            function selectLanguage(lang) {
                currentLang = lang;
                const langData = languages[lang];
                
                // Aggiorna UI
                currentLanguageEl.textContent = langData.name;
                selectedLanguageName.textContent = langData.name + ' (' + langData.native + ')';
                
                // Evidenzia marker
                highlightMarker(lang);
                
                // Cambia audio e avvia
                audioPlayer.pause();
                audioSource.src = langData.file;
                audioPlayer.load();
                
                // Avvia automaticamente la riproduzione
                audioPlayer.play().then(() => {
                    playButton.textContent = '⏸ Pausa';
                    playButton.classList.add('playing');
                }).catch(e => {
                    console.error('Play error:', e);
                });
            }

            // Play/Pause button
            playButton.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        playButton.textContent = '⏸ Pausa';
                        playButton.classList.add('playing');
                    }).catch(e => console.error('Play error:', e));
                } else {
                    audioPlayer.pause();
                    playButton.textContent = '▶ Audi Canticum';
                    playButton.classList.remove('playing');
                }
            });

            audioPlayer.addEventListener('play', function() {
                playButton.textContent = '⏸ Pausa';
                playButton.classList.add('playing');
            });

            audioPlayer.addEventListener('pause', function() {
                playButton.textContent = '▶ Audi Canticum';
                playButton.classList.remove('playing');
            });

            // Inizializza
            initGlobe();
        });
    </script>
