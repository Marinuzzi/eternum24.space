<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Memoriam Papae Francisci</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            background: linear-gradient(180deg, #0a0505 0%, #1a0f0f 50%, #0a0505 100%);
            color: #e8d5b7;
            text-align: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(139, 69, 19, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 80px;
            padding: 60px 20px 40px;
            position: relative;
            animation: fadeInDown 1.5s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }

        .cross {
            font-size: 4.5em;
            color: #d4af37;
            margin: 20px 0 30px;
            text-shadow: 
                0 0 15px rgba(212, 175, 55, 0.6),
                0 0 30px rgba(212, 175, 55, 0.4);
            line-height: 1;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(212, 175, 55, 0.4);
            letter-spacing: 6px;
            font-weight: 700;
            line-height: 1.2;
        }

        h2 {
            color: #c9a961;
            font-style: italic;
            font-weight: 400;
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 
                1px 1px 3px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(201, 169, 97, 0.3);
            letter-spacing: 3px;
        }

        .dates {
            margin: 30px 0 0;
            font-size: 1.4em;
            color: #b8966b;
            letter-spacing: 5px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(184, 150, 107, 0.4);
            font-variant-numeric: oldstyle-nums;
        }

        .language-section {
            margin: 50px 0;
            padding: 40px;
            background: 
                linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(26, 10, 10, 0.8) 100%),
                radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 60px rgba(212, 175, 55, 0.1);
        }

        .section-title {
            font-size: 1.8em;
            color: #d4af37;
            margin-bottom: 30px;
            font-style: italic;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 2px;
        }

        .language-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .language-card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5) 0%, rgba(26, 10, 10, 0.7) 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .language-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .language-card:hover::before {
            opacity: 1;
        }

        .language-card:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(184, 134, 11, 0.3) 100%);
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 
                0 10px 30px rgba(212, 175, 55, 0.5),
                inset 0 0 30px rgba(212, 175, 55, 0.1);
        }

        .language-card.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(184, 134, 11, 0.4) 100%);
            border-color: #d4af37;
            box-shadow: 
                0 0 30px rgba(212, 175, 55, 0.8),
                inset 0 0 40px rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
        }

        .language-card-name {
            font-size: 1.3em;
            color: #e8d5b7;
            margin-bottom: 8px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .language-card-native {
            font-size: 1.1em;
            color: #b8966b;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .audio-controls {
            margin: 50px 0;
            padding: 40px;
            background: 
                linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(26, 10, 10, 0.8) 100%),
                radial-gradient(circle at center, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 60px rgba(212, 175, 55, 0.1);
        }

        .current-language {
            font-size: 1.8em;
            color: #d4af37;
            margin-bottom: 25px;
            font-style: italic;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 2px;
        }

        .instructions {
            font-style: italic;
            margin: 20px 0;
            color: #b8966b;
            font-size: 1.2em;
        }

        .play-button {
            display: inline-block;
            background: linear-gradient(135deg, #8b6914 0%, #d4af37 30%, #f4d03f 50%, #d4af37 70%, #8b6914 100%);
            background-size: 200% 200%;
            color: #1a0a0a;
            padding: 20px 45px;
            font-size: 1.4em;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin: 25px 0;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 
                0 6px 20px rgba(212, 175, 55, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .play-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .play-button:hover {
            transform: scale(1.08);
            box-shadow: 
                0 8px 30px rgba(212, 175, 55, 0.7),
                inset 0 2px 15px rgba(255, 255, 255, 0.3);
            background-position: 100% 0;
        }

        .play-button.playing {
            background: linear-gradient(135deg, #6b4e0f 0%, #b8960b 30%, #d4af37 50%, #b8960b 70%, #6b4e0f 100%);
            animation: buttonPulse 2s ease-in-out infinite;
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.8),
                inset 0 2px 15px rgba(255, 255, 255, 0.3);
        }

        @keyframes buttonPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(212, 175, 55, 0.6),
                    inset 0 2px 10px rgba(255, 255, 255, 0.2);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(212, 175, 55, 1),
                    inset 0 2px 15px rgba(255, 255, 255, 0.4);
            }
        }

        footer {
            margin-top: 80px;
            color: #8b7355;
            font-size: 1.3em;
            line-height: 2.2;
            padding: 40px;
            border-top: 2px solid rgba(212, 175, 55, 0.2);
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        footer p {
            margin: 15px 0;
            font-style: italic;
            text-shadow: 0 0 10px rgba(139, 115, 85, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8em;
            }

            h2 {
                font-size: 1.6em;
            }

            .cross {
                font-size: 3.5em;
            }

            .language-cards {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 15px;
            }

            .language-section,
            .audio-controls {
                padding: 25px;
            }

            .play-button {
                padding: 18px 35px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="cross">✝</div>
            <h1>In Memoriam</h1>
            <h2>Papae Francisci</h2>
            <div class="dates">
                <p>MCMXXXVI – MMXXV</p>
            </div>
        </div>

        <div class="language-section">
            <div class="section-title">Elige linguam canticorum</div>
            <div class="language-cards" id="languageCards"></div>
        </div>

        <div class="audio-controls">
            <div class="current-language" id="currentLanguage">Latina</div>
            <div class="instructions">Ad cantum audiendum, preme hoc signum:</div>
            <button id="playButton" class="play-button">Audi Canticum</button>
            <audio id="audioPlayer" loop>
                <source id="audioSource" src="Franciscus-de-Caelo-LT.mp3" type="audio/mpeg">
                Tuum navigatrum non sustinet elementum audio.
            </audio>
        </div>

        <footer>
            <p>Requiescat in Pace</p>
            <p>Lux perpetua luceat ei</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playButton = document.getElementById('playButton');
            const audioPlayer = document.getElementById('audioPlayer');
            const audioSource = document.getElementById('audioSource');
            const currentLanguage = document.getElementById('currentLanguage');
            const languageCards = document.getElementById('languageCards');
            
            // Mappa delle lingue
            const languages = {
                latin: {
                    file: "Franciscus-de-Caelo-LT.mp3",
                    name: "Latina",
                    native: "Latina"
                },
                italian: {
                    file: "Franciscus-de-Caelo-IT.mp3",
                    name: "Italica",
                    native: "Italiano"
                },
                german: {
                    file: "Franciscus-de-Caelo-TE.mp3",
                    name: "Germanica",
                    native: "Deutsch"
                },
                russian: {
                    file: "Franciscus-de-Caelo-RU.mp3",
                    name: "Russica",
                    native: "Русский"
                },
                hebrew: {
                    file: "Franciscus-de-Caelo-SR.mp3",
                    name: "Hebraica",
                    native: "עברית"
                },
                korean: {
                    file: "Franciscus-de-Caelo-KR.mp3",
                    name: "Coreana",
                    native: "한국어"
                },
                arabic: {
                    file: "Franciscus-de-Caelo-ARA.mp3",
                    name: "Arabica",
                    native: "العربية"
                },
                chinese: {
                    file: "Franciscus-de-Caelo-CIN.mp3",
                    name: "Sinica",
                    native: "中文"
                },
                portuguese: {
                    file: "Franciscus-de-Caelo-POR.mp3",
                    name: "Lusitana",
                    native: "Português"
                },
                swahili: {
                    file: "Franciscus-de-Caelo-SWAHILI.mp3",
                    name: "Swahili",
                    native: "Kiswahili"
                },
                hausa: {
                    file: "Franciscus-de-Caelo-HAUSA.mp3",
                    name: "Hausa",
                    native: "Hausa"
                },
                lingala: {
                    file: "Franciscus-de-Caelo-LINGALA.mp3",
                    name: "Lingala",
                    native: "Lingála"
                },
                spanish: {
                    file: "Franciscus-de-Caelo-SP.mp3",
                    name: "Hispanica",
                    native: "Español"
                },
                french: {
                    file: "Franciscus-de-Caelo-FR.mp3",
                    name: "Gallica",
                    native: "Français"
                },
                english: {
                    file: "Franciscus-de-Caelo-UK.mp3",
                    name: "Anglica",
                    native: "English"
                }
            };

            let currentLang = 'latin';

            // Crea le card delle lingue
            function createLanguageCards() {
                Object.keys(languages).forEach(lang => {
                    const card = document.createElement('div');
                    card.className = 'language-card';
                    card.dataset.lang = lang;
                    if (lang === currentLang) {
                        card.classList.add('active');
                    }
                    
                    card.innerHTML = `
                        <div class="language-card-name">${languages[lang].name}</div>
                        <div class="language-card-native">${languages[lang].native}</div>
                    `;
                    
                    card.addEventListener('click', () => selectLanguage(lang));
                    languageCards.appendChild(card);
                });
            }

            // Seleziona una lingua
            function selectLanguage(lang) {
                if (lang === currentLang) return;
                
                currentLang = lang;
                const wasPlaying = !audioPlayer.paused;
                
                // Aggiorna UI
                document.querySelectorAll('.language-card').forEach(card => {
                    card.classList.toggle('active', card.dataset.lang === lang);
                });
                
                currentLanguage.textContent = languages[lang].name;
                
                // Cambia audio
                audioPlayer.pause();
                audioSource.src = languages[lang].file;
                audioPlayer.load();
                
                if (wasPlaying) {
                    setTimeout(() => {
                        audioPlayer.play().catch(e => {
                            console.error('Play error:', e);
                            alert('Errore nella riproduzione. Verificare che il file audio sia disponibile.');
                        });
                    }, 300);
                }
            }

            // Gestione play/pause
            playButton.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    const playPromise = audioPlayer.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            playButton.textContent = 'Pausa Canticum';
                            playButton.classList.add('playing');
                        }).catch(e => {
                            console.error('Play error:', e);
                            alert('Errore nella riproduzione. Verificare che il file audio sia disponibile.');
                        });
                    }
                } else {
                    audioPlayer.pause();
                    playButton.textContent = 'Audi Canticum';
                    playButton.classList.remove('playing');
                }
            });

            // Event listeners per l'audio
            audioPlayer.addEventListener('play', function() {
                playButton.textContent = 'Pausa Canticum';
                playButton.classList.add('playing');
            });

            audioPlayer.addEventListener('pause', function() {
                playButton.textContent = 'Audi Canticum';
                playButton.classList.remove('playing');
            });

            audioPlayer.addEventListener('error', function(e) {
                console.error('Audio error:', e, audioPlayer.error);
                playButton.textContent = 'Audi Canticum';
                playButton.classList.remove('playing');
                alert('Errore nel caricamento del file audio. Verificare che tutti i file siano presenti.');
            });

            // Inizializza
            createLanguageCards();
        });
    </script>
    <script src="https://cdn.counter.dev/script.js" data-id="99356092-0a36-47fb-acba-e7b5c99ca1b3" data-utcoffset="2"></script>
</body>
</html>
