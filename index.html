<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Memoriam Papae Francisci</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            background: #0a0505;
            color: #e8d5b7;
            text-align: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(184, 134, 11, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 69, 19, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
            background-size: 100% 100%;
            animation: backgroundPulse 15s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
            50% { background-position: 10% 10%, 90% 90%, 60% 40%; }
        }

        /* Stelle animate */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #d4af37;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.8);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Particelle di luce divine */
        .divine-light {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .light-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.9) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s linear infinite;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 60px;
            animation: fadeInDown 2s ease-out;
            position: relative;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cross-wrapper {
            position: relative;
            display: inline-block;
            margin: 30px 0;
        }

        .cross {
            font-size: 6em;
            color: #d4af37;
            margin: 20px 0;
            text-shadow: 
                0 0 20px rgba(212, 175, 55, 0.8),
                0 0 40px rgba(212, 175, 55, 0.6),
                0 0 60px rgba(212, 175, 55, 0.4),
                0 0 80px rgba(212, 175, 55, 0.2);
            animation: crossGlow 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .cross::before {
            content: '✝';
            position: absolute;
            top: 0;
            left: 0;
            color: rgba(212, 175, 55, 0.3);
            filter: blur(20px);
            z-index: -1;
            animation: crossGlow 4s ease-in-out infinite reverse;
        }

        @keyframes crossGlow {
            0%, 100% {
                text-shadow: 
                    0 0 20px rgba(212, 175, 55, 0.8),
                    0 0 40px rgba(212, 175, 55, 0.6),
                    0 0 60px rgba(212, 175, 55, 0.4);
                transform: scale(1);
            }
            50% {
                text-shadow: 
                    0 0 30px rgba(212, 175, 55, 1),
                    0 0 60px rgba(212, 175, 55, 0.8),
                    0 0 90px rgba(212, 175, 55, 0.6),
                    0 0 120px rgba(212, 175, 55, 0.4);
                transform: scale(1.05);
            }
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 4.5em;
            margin-bottom: 0.3em;
            text-shadow: 
                3px 3px 6px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(212, 175, 55, 0.5);
            letter-spacing: 5px;
            font-weight: 700;
            animation: titleShimmer 3s ease-in-out infinite;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 50%, #d4af37 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 3s ease-in-out infinite, gradientShift 5s ease infinite;
        }

        @keyframes titleShimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        h2 {
            color: #c9a961;
            font-style: italic;
            font-weight: 400;
            font-size: 2.5em;
            margin-bottom: 1em;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(201, 169, 97, 0.4);
            letter-spacing: 2px;
        }

        .dates {
            margin: 40px 0;
            font-size: 1.6em;
            color: #b8966b;
            letter-spacing: 4px;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(184, 150, 107, 0.5);
            position: relative;
        }

        .dates::before,
        .dates::after {
            content: '—';
            color: #8b7355;
            margin: 0 20px;
            font-size: 1.2em;
        }

        .world-map-container {
            margin: 50px 0;
            padding: 40px;
            background: 
                linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(26, 10, 10, 0.8) 100%),
                radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 60px rgba(212, 175, 55, 0.1),
                0 0 80px rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .world-map-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
            pointer-events: none;
        }

        .map-title {
            font-size: 1.8em;
            color: #d4af37;
            margin-bottom: 30px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .world-map {
            width: 100%;
            max-width: 1000px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
            position: relative;
            z-index: 1;
        }

        /* Mappa del mondo più dettagliata */
        .continent {
            fill: rgba(212, 175, 55, 0.08);
            stroke: rgba(212, 175, 55, 0.4);
            stroke-width: 1.5;
            transition: all 0.3s ease;
        }

        .continent:hover {
            fill: rgba(212, 175, 55, 0.15);
            stroke: rgba(212, 175, 55, 0.6);
        }

        .language-marker {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        }

        .language-marker:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 1)) brightness(1.5);
        }

        .language-marker.active {
            animation: markerPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 1));
        }

        @keyframes markerPulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
                r: 10;
            }
            50% { 
                opacity: 0.9; 
                transform: scale(1.2);
                r: 12;
            }
        }

        .language-marker.active::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            animation: ripple 2s ease-out infinite;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .language-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin: 40px 0;
            padding: 0 20px;
        }

        .language-card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5) 0%, rgba(26, 10, 10, 0.7) 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .language-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .language-card:hover::before {
            opacity: 1;
        }

        .language-card:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(184, 134, 11, 0.3) 100%);
            border-color: #d4af37;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 10px 30px rgba(212, 175, 55, 0.5),
                inset 0 0 30px rgba(212, 175, 55, 0.1);
        }

        .language-card.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(184, 134, 11, 0.4) 100%);
            border-color: #d4af37;
            box-shadow: 
                0 0 30px rgba(212, 175, 55, 0.8),
                inset 0 0 40px rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
        }

        .language-card-name {
            font-size: 1.2em;
            color: #e8d5b7;
            margin-bottom: 8px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .language-card-native {
            font-size: 1em;
            color: #b8966b;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .audio-controls {
            margin: 50px 0;
            padding: 40px;
            background: 
                linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(26, 10, 10, 0.8) 100%),
                radial-gradient(circle at center, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 60px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        .audio-controls::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .current-language {
            font-size: 1.6em;
            color: #d4af37;
            margin-bottom: 25px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 2px;
        }

        .instructions {
            font-style: italic;
            margin: 20px 0;
            color: #b8966b;
            font-size: 1.2em;
        }

        .play-button {
            display: inline-block;
            background: linear-gradient(135deg, #8b6914 0%, #d4af37 30%, #f4d03f 50%, #d4af37 70%, #8b6914 100%);
            background-size: 200% 200%;
            color: #1a0a0a;
            padding: 22px 50px;
            font-size: 1.5em;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin: 25px 0;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                0 6px 20px rgba(212, 175, 55, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .play-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 
                0 8px 30px rgba(212, 175, 55, 0.7),
                inset 0 2px 15px rgba(255, 255, 255, 0.3);
            background-position: 100% 0;
        }

        .play-button:active {
            transform: scale(1.05);
        }

        .play-button.playing {
            background: linear-gradient(135deg, #6b4e0f 0%, #b8960b 30%, #d4af37 50%, #b8960b 70%, #6b4e0f 100%);
            animation: buttonPulse 2s ease-in-out infinite, gradientMove 3s ease infinite;
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.8),
                inset 0 2px 15px rgba(255, 255, 255, 0.3);
        }

        @keyframes buttonPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(212, 175, 55, 0.6),
                    inset 0 2px 10px rgba(255, 255, 255, 0.2);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(212, 175, 55, 1),
                    inset 0 2px 15px rgba(255, 255, 255, 0.4);
            }
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Visualizzatore audio */
        .audio-visualizer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin: 30px 0;
            height: 60px;
        }

        .audio-bar {
            width: 4px;
            background: linear-gradient(to top, #8b6914, #d4af37, #f4d03f);
            border-radius: 2px;
            transition: height 0.1s ease;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .audio-bar.animate {
            animation: barPulse 1.5s ease-in-out infinite;
        }

        @keyframes barPulse {
            0%, 100% { 
                height: 20px;
                opacity: 0.6;
            }
            50% { 
                height: 50px;
                opacity: 1;
            }
        }

        footer {
            margin-top: 80px;
            color: #8b7355;
            font-size: 1.3em;
            line-height: 2.2;
            padding: 40px;
            border-top: 2px solid rgba(212, 175, 55, 0.2);
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        footer p {
            margin: 15px 0;
            font-style: italic;
            text-shadow: 0 0 10px rgba(139, 115, 85, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }

            h2 {
                font-size: 1.8em;
            }

            .cross {
                font-size: 4em;
            }

            .language-cards {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 15px;
            }

            .world-map-container,
            .audio-controls {
                padding: 25px;
            }

            .play-button {
                padding: 18px 35px;
                font-size: 1.2em;
            }
        }

        /* Animazioni di entrata */
        .fade-in {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="divine-light" id="divineLight"></div>

    <div class="container">
        <div class="header">
            <div class="cross-wrapper">
                <div class="cross">✝</div>
            </div>
            <h1>In Memoriam</h1>
            <h2>Papae Francisci</h2>
            <div class="dates">
                <p>MCMXXXVI – MMXXV</p>
            </div>
        </div>

        <div class="world-map-container fade-in">
            <div class="map-title">Elige linguam canticorum</div>
            <svg class="world-map" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Continenti più dettagliati -->
                <path class="continent" d="M150,180 Q200,160 250,180 T350,200 L380,250 L320,280 L200,270 L150,220 Z" />
                <path class="continent" d="M400,150 Q500,140 600,150 T700,170 L720,220 L650,240 L500,230 L400,200 Z" />
                <path class="continent" d="M700,120 Q800,110 900,120 L920,180 L850,200 L750,190 L700,150 Z" />
                <path class="continent" d="M180,300 Q300,290 400,300 T550,320 L580,380 L450,400 L250,390 L180,350 Z" />
                <path class="continent" d="M550,280 Q650,270 750,280 T900,300 L920,360 L800,380 L600,370 L550,320 Z" />
                <path class="continent" d="M200,400 Q350,390 500,400 L520,450 L400,470 L250,460 L200,420 Z" />
                
                <!-- Punti per le lingue con posizioni più accurate -->
                <circle class="language-marker" data-lang="latin" cx="500" cy="250" r="10" fill="#d4af37" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
                <circle class="language-marker" data-lang="italian" cx="520" cy="240" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="spanish" cx="200" cy="280" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="portuguese" cx="250" cy="300" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="french" cx="480" cy="220" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="english" cx="300" cy="200" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="german" cx="510" cy="230" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="russian" cx="600" cy="180" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="arabic" cx="550" cy="260" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="hebrew" cx="560" cy="250" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="chinese" cx="750" cy="240" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="korean" cx="780" cy="230" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="swahili" cx="580" cy="320" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="hausa" cx="500" cy="290" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <circle class="language-marker" data-lang="lingala" cx="550" cy="310" r="8" fill="#d4af37" stroke="#fff" stroke-width="2" opacity="0.9"/>
            </svg>
        </div>

        <div class="language-cards fade-in" id="languageCards"></div>

        <div class="audio-controls fade-in">
            <div class="current-language" id="currentLanguage">Latina</div>
            <div class="instructions">Ad cantum audiendum, preme hoc signum:</div>
            <div class="audio-visualizer" id="audioVisualizer"></div>
            <button id="playButton" class="play-button">Audi Canticum</button>
            <audio id="audioPlayer" loop>
                <source id="audioSource" src="Franciscus-de-Caelo-LT.mp3" type="audio/mpeg">
                Tuum navigatrum non sustinet elementum audio.
            </audio>
        </div>

        <footer class="fade-in">
            <p>Requiescat in Pace</p>
            <p>Lux perpetua luceat ei</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Crea stelle
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }

            // Crea particelle di luce divine
            const lightContainer = document.getElementById('divineLight');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'light-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's');
                lightContainer.appendChild(particle);
            }

            const playButton = document.getElementById('playButton');
            const audioPlayer = document.getElementById('audioPlayer');
            const audioSource = document.getElementById('audioSource');
            const currentLanguage = document.getElementById('currentLanguage');
            const languageCards = document.getElementById('languageCards');
            const audioVisualizer = document.getElementById('audioVisualizer');
            
            // Crea visualizzatore audio
            for (let i = 0; i < 40; i++) {
                const bar = document.createElement('div');
                bar.className = 'audio-bar';
                bar.style.height = Math.random() * 30 + 20 + 'px';
                bar.style.animationDelay = (i * 0.05) + 's';
                audioVisualizer.appendChild(bar);
            }

            // Mappa delle lingue
            const languages = {
                latin: {
                    file: "Franciscus-de-Caelo-LT.mp3",
                    name: "Latina",
                    native: "Latina"
                },
                italian: {
                    file: "Franciscus-de-Caelo-IT.mp3",
                    name: "Italica",
                    native: "Italiano"
                },
                german: {
                    file: "Franciscus-de-Caelo-TE.mp3",
                    name: "Germanica",
                    native: "Deutsch"
                },
                russian: {
                    file: "Franciscus-de-Caelo-RU.mp3",
                    name: "Russica",
                    native: "Русский"
                },
                hebrew: {
                    file: "Franciscus-de-Caelo-SR.mp3",
                    name: "Hebraica",
                    native: "עברית"
                },
                korean: {
                    file: "Franciscus-de-Caelo-KR.mp3",
                    name: "Coreana",
                    native: "한국어"
                },
                arabic: {
                    file: "Franciscus-de-Caelo-ARA.mp3",
                    name: "Arabica",
                    native: "العربية"
                },
                chinese: {
                    file: "Franciscus-de-Caelo-CIN.mp3",
                    name: "Sinica",
                    native: "中文"
                },
                portuguese: {
                    file: "Franciscus-de-Caelo-POR.mp3",
                    name: "Lusitana",
                    native: "Português"
                },
                swahili: {
                    file: "Franciscus-de-Caelo-SWAHILI.mp3",
                    name: "Swahili",
                    native: "Kiswahili"
                },
                hausa: {
                    file: "Franciscus-de-Caelo-HAUSA.mp3",
                    name: "Hausa",
                    native: "Hausa"
                },
                lingala: {
                    file: "Franciscus-de-Caelo-LINGALA.mp3",
                    name: "Lingala",
                    native: "Lingála"
                },
                spanish: {
                    file: "Franciscus-de-Caelo-SP.mp3",
                    name: "Hispanica",
                    native: "Español"
                },
                french: {
                    file: "Franciscus-de-Caelo-FR.mp3",
                    name: "Gallica",
                    native: "Français"
                },
                english: {
                    file: "Franciscus-de-Caelo-UK.mp3",
                    name: "Anglica",
                    native: "English"
                }
            };

            let currentLang = 'latin';
            let visualizerInterval;

            // Animazione visualizzatore
            function animateVisualizer() {
                const bars = audioVisualizer.querySelectorAll('.audio-bar');
                bars.forEach((bar, index) => {
                    const height = Math.random() * 40 + 25;
                    bar.style.height = height + 'px';
                    bar.style.opacity = 0.4 + (height / 80);
                });
            }

            // Crea le card delle lingue
            function createLanguageCards() {
                Object.keys(languages).forEach(lang => {
                    const card = document.createElement('div');
                    card.className = 'language-card';
                    card.dataset.lang = lang;
                    if (lang === currentLang) {
                        card.classList.add('active');
                    }
                    
                    card.innerHTML = `
                        <div class="language-card-name">${languages[lang].name}</div>
                        <div class="language-card-native">${languages[lang].native}</div>
                    `;
                    
                    card.addEventListener('click', () => selectLanguage(lang));
                    languageCards.appendChild(card);
                });
            }

            // Seleziona una lingua
            function selectLanguage(lang) {
                if (lang === currentLang) return;
                
                currentLang = lang;
                const wasPlaying = !audioPlayer.paused;
                
                // Aggiorna UI con animazione
                document.querySelectorAll('.language-card').forEach(card => {
                    const isActive = card.dataset.lang === lang;
                    card.classList.toggle('active', isActive);
                    if (isActive) {
                        card.style.animation = 'fadeIn 0.5s ease';
                    }
                });
                
                document.querySelectorAll('.language-marker').forEach(marker => {
                    marker.classList.toggle('active', marker.dataset.lang === lang);
                });
                
                currentLanguage.textContent = languages[lang].name;
                currentLanguage.style.animation = 'fadeIn 0.5s ease';
                
                // Cambia audio
                audioPlayer.pause();
                audioSource.src = languages[lang].file;
                audioPlayer.load();
                
                if (wasPlaying) {
                    setTimeout(() => {
                        audioPlayer.play().catch(e => console.error('Play error:', e));
                    }, 300);
                }
            }

            // Gestione click sui marker della mappa
            document.querySelectorAll('.language-marker').forEach(marker => {
                marker.addEventListener('click', () => {
                    const lang = marker.dataset.lang;
                    selectLanguage(lang);
                    document.querySelector('.audio-controls').scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });

            // Gestione play/pause
            playButton.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        playButton.textContent = 'Pausa Canticum';
                        playButton.classList.add('playing');
                        visualizerInterval = setInterval(animateVisualizer, 100);
                    }).catch(e => {
                        console.error('Play error:', e);
                        alert('Errore nella riproduzione. Verificare che il file audio sia disponibile.');
                    });
                } else {
                    audioPlayer.pause();
                    playButton.textContent = 'Audi Canticum';
                    playButton.classList.remove('playing');
                    if (visualizerInterval) {
                        clearInterval(visualizerInterval);
                    }
                }
            });

            // Event listeners per l'audio
            audioPlayer.addEventListener('play', function() {
                playButton.textContent = 'Pausa Canticum';
                playButton.classList.add('playing');
                visualizerInterval = setInterval(animateVisualizer, 100);
            });

            audioPlayer.addEventListener('pause', function() {
                playButton.textContent = 'Audi Canticum';
                playButton.classList.remove('playing');
                if (visualizerInterval) {
                    clearInterval(visualizerInterval);
                }
            });

            audioPlayer.addEventListener('error', function(e) {
                console.error('Audio error:', e, audioPlayer.error);
                playButton.textContent = 'Audi Canticum';
                playButton.classList.remove('playing');
                if (visualizerInterval) {
                    clearInterval(visualizerInterval);
                }
                alert('Errore nel caricamento del file audio. Verificare che tutti i file siano presenti.');
            });

            // Inizializza
            createLanguageCards();
            document.querySelector(`.language-marker[data-lang="${currentLang}"]`).classList.add('active');
        });
    </script>
    <script src="https://cdn.counter.dev/script.js" data-id="99356092-0a36-47fb-acba-e7b5c99ca1b3" data-utcoffset="2"></script>
