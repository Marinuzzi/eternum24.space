# ============================================
# Nginx config per api.eternum24.space
# ============================================
# Copia in: /etc/nginx/sites-available/eternum24-api
# Poi: ln -s /etc/nginx/sites-available/eternum24-api /etc/nginx/sites-enabled/

server {
    server_name api.eternum24.space;

    # Proxy tutto a FastAPI
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Per streaming audio
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    listen 80;
}
