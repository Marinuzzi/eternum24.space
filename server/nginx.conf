# ============================================
# Nginx config per eternum24.space
# ============================================
# Copia in: /etc/nginx/sites-available/eternum24
# Poi: ln -s /etc/nginx/sites-available/eternum24 /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#      certbot --nginx -d eternum24.space -d www.eternum24.space

server {
    server_name eternum24.space www.eternum24.space;

    # Sito statico (index.html, textures, etc.)
    root /var/www/eternum24/public;
    index index.html;

    # Pagine statiche
    location / {
        try_files $uri $uri/ =404;
    }

    # IMPORTANTE: blocca accesso diretto alla cartella audio
    # Gli mp3 devono passare SOLO da /api/audio/
    location /audio/ {
        return 404;
    }

    # Proxy API → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Per streaming audio
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Certbot aggiungerà qui le righe SSL
    listen 80;
}
